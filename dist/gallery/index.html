<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MDM Creation Gallery</title>
  <meta name="description" content="Browse recent MDM Creation projects in branding, website design, social media marketing, digital business cards, and business support.">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta property="og:title" content="MDM Creation Gallery">
  <meta property="og:description" content="Recent brand, website, and digital business card projects from MDM Creation.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mdmcreation.com/gallery.html">
  <meta property="og:image" content="https://mdmcreation.com/assets/mdm-logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MDM Creation Gallery">
  <meta name="twitter:description" content="Recent work from MDM Creation.">
  <meta name="theme-color" content="#2b135c">
  <link rel="icon" href="../assets/mdm-logo.png">
  <link rel="canonical" href="https://mdmcreation.com/gallery.html">
  <link rel="stylesheet" href="../assets/mdm-gallery.css">
  <style>
    :root{--ink:#25113f;--violet:#4a1f7a;--pink:#d34598;--aqua:#12a9c2;--paper:#fffafe;--muted:#6f6278;--line:#e9ddef}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}a{text-decoration:none;color:inherit}.gallery-page{padding:70px 0 90px}.gallery-page .wrap{width:min(1160px,calc(100% - 40px));margin:auto}.page-header{margin-bottom:28px;text-align:center}.page-header h1{margin:0 0 12px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.8rem,5vw,5rem);letter-spacing:-.05em;line-height:1}.page-header p{margin:0 auto;max-width:620px;color:var(--muted);font-size:1.08rem}.gallery-status{padding:22px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);text-align:center}.gallery-status[hidden]{display:none}.gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:28px}.gallery-item{position:relative;display:block;min-height:220px;overflow:hidden;border-radius:18px;background:#f3eaf4}.gallery-item img{width:100%;height:100%;min-height:220px;display:block;object-fit:cover;transition:transform .35s ease}.gallery-item:hover img{transform:scale(1.04)}.gallery-item figcaption{position:absolute;right:10px;bottom:10px;left:10px;padding:8px 10px;border-radius:10px;background:rgba(37,17,63,.82);color:#fff;font-size:.78rem}.back-link{display:inline-block;margin-top:18px;color:var(--violet);font-weight:800}@media(max-width:850px){.gallery-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.gallery-grid{grid-template-columns:1fr}.gallery-item,.gallery-item img{min-height:260px}}
  </style>
</head>
<body>
  <main class="gallery-page">
    <div class="wrap">
      <div class="page-header">
        <h1>MDM Creation Gallery</h1>
        <p>Recent approved work from branding, website design, digital business cards, and business support projects.</p>
        <a class="back-link" href="../index.html">← Back to home</a>
      </div>
      <div class="gallery-status" data-gallery-status><span>Loading approved projects…</span></div>
      <div class="gallery-grid" data-mdm-gallery></div>
    </div>
  </main>
  <script src="../assets/mdm-gallery.js"></script>
</body>
</html>
